  summary: >
    Assistant Professor (Tenure-Track) at Aalborg University, affiliated with the Edge Computing and
    Networking Group, the CMI Section, and the Department of Electronic Systems. Research interests
    include memristive computing architectures for edge intelligence, device modeling, stochastic
    phenomena in resistive switching systems, cellular nonlinear networks, neuromorphic circuits,
    and cellular automata.

