courses:
  - title: Introduction to Computer Engineering
    level: BSc
    term: Fall
    url: https://moduler.aau.dk/course/2024-2025/ESNCCEB1K1
    description: First-year foundations of computer engineering, introducing how hardware and software come together in modern computing systems.
  - title: Programming of Embedded Systems
    level: BSc
    term: Fall
    url: https://moduler.aau.dk/course/2024-2025/ESNCCTB3K1
    description: Low-level programming of microcontroller-based systems, covering peripherals, real-time behavior, and the hardware/software interface.
  - title: Numerical Scientific Computing
    level: MSc
    term: Spring
    url: https://moduler.aau.dk/course/2025-2026/ESNAVSK2K3?lang=en-GB
    description: Scientific computing for engineering problems with an emphasis on high-performance implementation, exploiting modern hardware, parallelism, and memory hierarchies for efficient computation.

